<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Painel Admin</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
        background: #f5f5f5;
      }
      .pedido {
        background: white;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .novo {
        border-left: 6px solid green;
      }
      .preparo {
        border-left: 6px solid orange;
      }
      .entrega {
        border-left: 6px solid blue;
      }
    </style>
  </head>
  <body>
    <button onclick="loginGoogle()">Entrar com Google</button>

    <h1>📦 Painel de Pedidos</h1>

    <h2>💰 Total vendido hoje: R$ <span id="totalHoje">0,00</span></h2>

    <div id="listaPedidos"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAcv5sSPj2yUtw0CUJHbZpF0TTfEyshyiQ",
        authDomain: "churrasquinho-7b2d2.firebaseapp.com",
        projectId: "churrasquinho-7b2d2",
      };

      firebase.initializeApp(firebaseConfig);

      const auth = firebase.auth();
      const db = firebase.firestore();
      const provider = new firebase.auth.GoogleAuthProvider();

      const emailAdmin = "shirlianedurans@gmail.com";

      function loginGoogle() {
        auth.signInWithPopup(provider);
      }

      auth.onAuthStateChanged((user) => {
        if (!user) {
          document.getElementById("listaPedidos").innerHTML =
            "<h3>Faça login com Google</h3>";
          return;
        }

        if (user.email !== emailAdmin) {
          alert("Acesso permitido apenas para administrador!");
          auth.signOut();
          return;
        }

        carregarPedidos();
      });

      function carregarPedidos() {
        const lista = document.getElementById("listaPedidos");

        db.collection("pedidos")
          .orderBy("criadoEm", "desc")
          .onSnapshot((snapshot) => {
            lista.innerHTML = "";

            snapshot.forEach((doc) => {
              const pedido = doc.data();

              lista.innerHTML += `
            <div style="background:white;padding:15px;margin:10px;border-radius:8px">
              <h3>${pedido.nome}</h3>
              <p><b>Total:</b> R$ ${pedido.total}</p>
              <p><b>Pagamento:</b> ${pedido.pagamento}</p>
              <p><b>Status:</b> ${pedido.status}</p>

              <button onclick="mudarStatus('${doc.id}', 'Recebido')">Recebido</button>
              <button onclick="mudarStatus('${doc.id}', 'Em preparo')">Em preparo</button>
              <button onclick="mudarStatus('${doc.id}', 'Saiu para entrega')">Saiu</button>
            </div>
          `;
            });
          });
      }

      function mudarStatus(id, novoStatus) {
        db.collection("pedidos").doc(id).update({
          status: novoStatus,
        });
      }
    </script>
  </body>
</html>
