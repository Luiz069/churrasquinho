<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="img/favcon.png" />

  <title>Admin - Central de Controle</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>

<body>
  <div id="loading" style="text-align: center; padding: 50px; font-family: sans-serif">
    <h2>Verificando acesso...</h2>
  </div>

  <div id="dashboard-content" style="display: none">
    <header>
      <h1>Painel Central Admin</h1>
    </header>

    <div class="dashboard-grid">
      <button class="btn-tab pedidos" onclick="window.location.href = 'html/painel.html'">
        <i class="fas fa-utensils"></i>
        <span>Controle de Pedidos</span>
      </button>

      <button class="btn-tab produtos" onclick="window.location.href = 'html/produtos.html'">
        <i class="fas fa-store"></i>
        <span>Gerenciamento de Produtos</span>
      </button>

      <button class="btn-tab financeiro" onclick="window.location.href = 'html/financeiro.html'">
        <i class="fas fa-wallet"></i>
        <span>Painel Financeiro</span>
      </button>
    </div>

    <button class="btn-logout" onclick="fazerLogout()">
      Sair do Sistema
    </button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script src="js/dashboard.js"></script>
</body>

</html>
