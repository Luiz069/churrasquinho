<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Pedidos</title>
  <link rel="icon" type="image/x-icon" href="img/favcon.png" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .pedido {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .status {
      padding: 5px 10px;
      border-radius: 5px;
      color: white;
      font-size: 12px;
    }

    .pendente {
      background: orange;
    }

    .preparando {
      background: blue;
    }

    .entregue {
      background: green;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #333;
      color: white;
      width: 100%;
    }

    /* LOGIN */
    .login-container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff4d4d, #b30000);
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 300px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <!-- LOGIN -->
  <div id="loginScreen" class="login-container">
    <div class="login-box">
      <h2>Login Admin</h2>
      <button onclick="loginGoogle()">Entrar com Google</button>
    </div>
    <!-- <button onclick="logout()" style="margin-top: 10px; background: #b30000">
        Sair
      </button> -->
  </div>

  <!-- PAINEL -->
  <div id="painel" class="hidden">
    <h1>Painel de Pedidos</h1>
    <div class="container" id="listaPedidos"></div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script src="js/login.js"></script>
</body>

</html>
